services:
  backend:
    build:
      context: ./backend
    container_name: fesf-sus-backend
    environment:
      DATABASE_PATH: /data/tasks.db
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: fesf-sus-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  backend-data:
